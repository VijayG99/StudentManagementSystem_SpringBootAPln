spring.application.name=student-management-system
server.port=8080

# PostgreSQL (create the sms_db database first: CREATE DATABASE sms_db;)
spring.datasource.url=jdbc:postgresql://localhost:5432/StdMgmtSystApp_DB
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.batch.sms=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Redis cache
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
# Cache entries expire after 10 minutes so stale catalog data self-heals
spring.cache.redis.time-to-live=600000

# Multipart file upload (student photos)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/students-images

# Swagger / OpenAPI UI at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator — exposed endpoints at /actuator/*. No authentication yet
# (that's added once Spring Security comes into the project), so treat
# these as visible to anyone who can reach this server for now.
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always

info.app.name=Student Management System
info.app.description=Phase 2 — relationships, caching, auditing, enrollment workflow

jwt.secret=StudentManagementSystemSecretKeyForJwtAuthentication123456789
jwt.expiration=3600000
